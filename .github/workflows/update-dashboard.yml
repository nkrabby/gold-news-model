name: Refresh Gold News Dashboard

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-news-refresh
  cancel-in-progress: false

jobs:
 - name: Find project files
  run: |
    pwd
    find . -maxdepth 4 \( -name refresh_live.py -o -name requirements.txt -o -name Gold_News_Dashboard.html \) -print    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
         

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install requirements
        run: python -m pip install -r requirements.txt
        

      - name: Refresh prices, calendar, research, models and dashboard
        run: python src/refresh_live.py
        
      - name: Commit refreshed files
        run: |
          git config user.name "gold-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f gold-news-model/outputs/forecast_log.csv \
                     gold-news-model/outputs/live_scoring.csv \
                     gold-news-model/outputs/live_status.json \
                     gold-news-model/Gold_News_Dashboard.html
          if git diff --cached --quiet; then
            echo "No material changes"
          else
            git commit -m "Refresh dashboard: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
