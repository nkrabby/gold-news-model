name: Refresh Gold News Dashboard

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Restore project folders
        run: |
          set -e
          mkdir -p src outputs data/raw data/processed download
          
          # The uploaded files are currently flat. Move Python modules into src/,
          # keeping app.py at the repository top level.
          for file in ./*.py; do
            [ -f "$file" ] || continue
            [ "$(basename "$file")" = "app.py" ] && continue
            mv "$file" src/
          done

          # Put persistent dashboard outputs where the project expects them.
          for file in forecast_log.csv live_scoring.csv live_status.json; do
            if [ -f "$file" ]; then
              mv "$file" outputs/
            fi
          done

          echo "Project files are now arranged:"
          ls -la
          ls -la src
          ls -la outputs

      - name: Refresh prices, calendar, research, models and dashboard
        run: python src/refresh_live.py

      - name: Commit refreshed files
        run: |
          set -e
          git config user.name "gold-news-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -f outputs/forecast_log.csv \
                     outputs/live_scoring.csv \
                     outputs/live_status.json \
                     Gold_News_Dashboard.html
          git add -f data/raw/xauusd_m5.csv data/raw/forexfactory_usd.csv data/raw/market/*.csv

          if git diff --cached --quiet; then
            echo "No material changes to commit."
          else
            git commit -m "Refresh dashboard: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
