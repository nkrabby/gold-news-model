name: Refresh Gold News Dashboard

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Find project, install requirements, refresh dashboard
        run: |
          set -e

          SCRIPT="$(find . -maxdepth 6 -type f -path '*/src/refresh_live.py' -print -quit)"
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: Could not find src/refresh_live.py in this repository."
            echo "Files and folders at the repository top level:"
            ls -la
            exit 1
          fi

          PROJECT_DIR="${SCRIPT%/src/refresh_live.py}"
          echo "Found refresh script: $SCRIPT"
          echo "Project directory: $PROJECT_DIR"

          REQUIREMENTS="$(find . -maxdepth 6 -type f -name requirements.txt -print -quit)"
          if [ -z "$REQUIREMENTS" ]; then
            echo "ERROR: Could not find requirements.txt."
            exit 1
          fi

          echo "Installing from: $REQUIREMENTS"
          python -m pip install -r "$REQUIREMENTS"

          echo "Starting dashboard refresh..."
          python "$SCRIPT"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Commit refreshed files
        run: |
          set -e

          git config user.name "gold-news-bot"
          git config user.email "actions@users.noreply.github.com"

          for file in \
            "$PROJECT_DIR/outputs/forecast_log.csv" \
            "$PROJECT_DIR/outputs/live_scoring.csv" \
            "$PROJECT_DIR/outputs/live_status.json" \
            "$PROJECT_DIR/Gold_News_Dashboard.html"
          do
            if [ -f "$file" ]; then
              git add -f "$file"
            else
              echo "Not present, skipping: $file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No material changes to commit."
          else
            git commit -m "Refresh dashboard: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
