name: Refresh Gold News Dashboard

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt
      - name: Refresh prices, calendar, research, models and dashboard
        run: python src/refresh_live.py
      - name: Commit only the files that must persist
        run: |
          git config user.name "gold-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f outputs/forecast_log.csv outputs/live_scoring.csv \
                     outputs/live_status.json Gold_News_Dashboard.html
          if git diff --cached --quiet; then
            echo "No material changes"
          else
            git commit -m "Refresh dashboard: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
