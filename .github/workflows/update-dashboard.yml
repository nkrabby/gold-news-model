name: Refresh Gold News Dashboard

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Load fallback code and seed bundle
        run: |
          set -e
          test -f gold_news_ci_fallback.zip
          mkdir -p .ci-fallback
          unzip -oq gold_news_ci_fallback.zip -d .ci-fallback
          cp .ci-fallback/patch/*.py .

      - name: Restore project folders and seed history
        run: |
          set -e
          mkdir -p src outputs data/raw data/processed download

          if [ ! -f data/raw/xauusd_m5.csv ]; then
            echo "Seeding saved market history"
            unzip -oq .ci-fallback/market_data_seed.zip -d .
          fi

          for file in ./*.py; do
            [ -f "$file" ] || continue
            [ "$(basename "$file")" = "app.py" ] && continue
            mv "$file" src/
          done

      - name: Refresh prices, calendar, research, models and dashboard
        run: python src/refresh_live.py

      - name: Commit dashboard, forecast memory, and reusable source data
        run: |
          set -e
          git config user.name "gold-news-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -f outputs/forecast_log.csv \
                     outputs/live_scoring.csv \
                     outputs/live_status.json \
                     Gold_News_Dashboard.html \
                     data/raw/xauusd_m5.csv \
                     data/raw/forexfactory_usd.csv \
                     data/raw/market/dxy_h1.csv \
                     data/raw/market/oil_h1.csv \
                     data/raw/market/volatility_h1.csv

          if git diff --cached --quiet; then
            echo "No material changes to commit."
          else
            git commit -m "Refresh dashboard: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
